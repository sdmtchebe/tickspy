# Netlify configuration.
#
# Import this repository for an automatic build: the settings reproduce the artifact
# the GitHub Pages workflow builds — the landing page at the site root and the
# trading desk at /desk/ — with no manual steps.
# For manual drag-and-drop, upload the built TickSPY-Netlify-Release folder.
#
# `base` is the frontend folder, because the desk is copied into it at build
# time by scripts/sync-desk.js (wired to `prebuild`, so it always runs). That
# script writes from ../desk into frontend/public/desk and strips the
# local-config.js reference out of the published desk, so no keys file is ever
# published.
#
# Daily HF Data Library refresh (Option B):
#   1. Set these env vars in Netlify dashboard → Site settings → Environment variables:
#      HF_DATA_KEY = your HF Data Library API key (free, 30-day expiry, https://hfdatalibrary.com)
#      GH_TOKEN    = GitHub PAT with repo:write scope
#      GH_REPO     = owner/repo (e.g., sdmtchebe/tickspy)
#      HF_TICKERS  = optional JSON array, e.g., '["SPY","QQQ","AAPL"]'
#   2. The scheduled function runs daily at 06:00 UTC (after US market close).
#      Adjust the cron in [functions.schedule] if needed.
#   3. On success, it commits updated desk/hfdata/*.json to the repo, triggering
#      a new Netlify build with fresh data.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NETLIFY_USE_YARN = "false"
  GENERATE_SOURCEMAP = "false"
  REACT_APP_ENABLE_ADS = "false"
  REACT_APP_SUPPORT_EMAIL = "tickspysupport@gmail.com"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["package.json", "package-lock.json"]

# Daily at 06:00 UTC (after US market close, before EU open)
[functions.schedule]
  "update-hfdata" = "0 6 * * *"

# Headers for security (also in _headers generated at build time)
[[headers]]
  for = "/*"
  values = { X-Frame-Options = "DENY", X-Content-Type-Options = "nosniff", Referrer-Policy = "strict-origin-when-cross-origin", Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" }

# Proxy for desk data API (same-origin on custom domain)
[[redirects]]
  from = "/edge/api/*"
  to = "https://tickspy-api.sdmtchebe.workers.dev/:splat"
  status = 200
  force = false

# TickSPY edge API — Cloudflare Worker configuration.
#
# Deploy:  cd worker && npx wrangler deploy
# Secrets: npx wrangler secret put GEMINI_API_KEY      (never goes in this file)

name = "tickspy-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Rebuild the cache on a schedule. This is what makes upstream calls track the
# clock rather than the audience: 72 Gemini calls a day no matter how many
# people visit. The 20-minute interval is shorter than the 25-minute TTL, so
# visitors almost always read an entry that is already fresh.
#
# The second entry is the price-data run. US price bars only change once a day,
# after the previous session has settled, so the desk's no-key data is fetched
# once a day and every visitor in between reads the same cached session. 05:17
# UTC is after the US close (20:00/21:00 UTC) and after Stooq publishes the
# session, and the odd minute keeps it off the top of the hour.
# The third entry is the Telegram-alert tick. It runs every five minutes and is
# deliberately the cheapest cron here: with no subscriptions, or with nothing
# due, it costs one invocation and one KV list, and makes no outbound request.
[triggers]
crons = ["*/20 * * * *", "17 5 * * *", "*/5 * * * *"]

# Global, durable cache shared by every isolate and every region.
# Create it once with:  npx wrangler kv namespace create CACHE
# then paste the printed id below.
[[kv_namespaces]]
binding = "CACHE"
id = "573639379943402dacd732d04e27ee93"

# Anonymous landing-page comments. A separate database from the cache: comments
# are user input and need real transactions, not a 60-second-propagating blob.
#
# Created once with:  npx wrangler d1 create tickspy-comments
# Schema:             npx wrangler d1 migrations apply tickspy-comments --remote
# Local development:  npx wrangler d1 migrations apply tickspy-comments --local
#
# The admin credential is a Worker secret, never a var:
#   npx wrangler secret put COMMENTS_ADMIN_TOKEN
# Without it, posting still works and moderation answers 503 rather than
# accepting an empty token.
[[d1_databases]]
binding = "COMMENTS_DB"
database_name = "tickspy-comments"
database_id = "69ab018c-c0c7-40a2-86a3-8f0dffff8aa0"
migrations_dir = "migrations"

[vars]
# A stable alias, so a model rename upstream does not take the endpoint down.
# Any model from the account's ListModels response works here.
GEMINI_MODEL = "gemini-flash-lite-latest"

# Telegram alerts. One public name and two secrets:
#
#   TELEGRAM_BOT_USERNAME   below. Public by definition — it is the @name every
#                           visitor opens in Telegram. Without it the desk cannot
#                           build the deep link, so it is required too.
#   TELEGRAM_BOT_TOKEN      secret: `npx wrangler secret put TELEGRAM_BOT_TOKEN`
#                           (from @BotFather; it is the whole authority of the bot)
#   TELEGRAM_WEBHOOK_SECRET secret: `npx wrangler secret put TELEGRAM_WEBHOOK_SECRET`
#                           (any long random string; Telegram echoes it back in a
#                           header, which is how the webhook knows the caller is
#                           Telegram and not anybody who found the URL)
#
# The bot only works once its webhook is registered — `node scripts/telegram-setup.mjs`
# does that, and also sets the commands shown in the chat. Until all of this is
# present, /api/alerts/config reports telegram:false and the desk says so plainly
# instead of offering a button that cannot work. See README.md.
TELEGRAM_BOT_USERNAME = "tickspy_alerts_bot"

# Where the "Open the desk" link in a message points. Only used in message copy.
PUBLIC_SITE_URL = "https://tickspy.com"

# Bot gate for the community wall. Optional, and off until BOTH values exist:
#
#   TURNSTILE_SITE_KEY   below. Public by definition — it is the key the page
#                        renders the widget with, and the Worker only hands it
#                        to a browser already reading the public feed.
#   TURNSTILE_SECRET_KEY secret: `npx wrangler secret put TURNSTILE_SECRET_KEY`
#
# Create a widget in the Cloudflare dashboard (Turnstile -> Add site), list the
# hostnames the wall is posted from (including any *.netlify.app preview you
# use), then put the site key here and the secret key on the Worker. With both
# present, POST /api/comments refuses a request with no valid, unused token;
# with either missing, posting behaves exactly as it did before.
TURNSTILE_SITE_KEY = ""

# The symbols the daily price cron warms, and the only ones whose bars are
# written to the durable KV cache (an arbitrary ticker is served from the
# per-isolate memory cache instead, so a script cannot fill the namespace).
#
# Deliberately just the desk's default watchlist. The free source publishes a low
# daily request quota, and each symbol costs three requests a day (one daily
# series, plus the 5-minute series and its daily companion), so this list is the
# whole of the scheduled load: 15 requests a day. Add symbols only if you know
# the quota can take it.
DESK_SYMBOLS = "SPY,QQQ,AAPL,NVDA,TSLA"

# Optional: force the clock Stooq stamps its CSV with. The Worker normally works
# this out from the data itself (see bars.js `detectZone`), so leave this unset
# unless the session looks shifted - then set it to e.g. "Europe/Warsaw".
# STOOQ_ZONE = "Europe/Warsaw"

# Browser origins allowed to call this API. An entry is either an exact origin
# or a host suffix ("*.netlify.app"), which matches any subdomain of it - that
# is what lets a Netlify deploy, and every deploy preview, reach the API without
# a redeploy here. Add your own domain if you move the site somewhere else.
# "*" works too but is needlessly permissive. This list is not the security
# boundary: every endpoint is a public, read-only GET, and the request budget is
# what protects the upstream quota.
ALLOWED_ORIGINS = "https://tickspy.com,https://www.tickspy.com,https://sdmtchebe.github.io,*.netlify.app,*.netlify.com,http://localhost:3000,http://localhost:8000,http://localhost:8767"

# Note for the alert endpoints: unlike the read-only routes, a wrong entry here
# means a visitor cannot connect Telegram at all, because the link-code and rules
# POSTs are refused unless the browser's Origin is on this list. A new deploy
# domain has to be added here (or covered by a *.netlify.app / *.netlify.com
# pattern). The bot's webhook is not affected: it carries no Origin and is
# authenticated by its own secret header.

[observability]
enabled = true

name: Deploy site + desk to GitHub Pages

# Publishes the marketing site at the Pages root and the trading desk at
# /desk/. "Open App" on the landing page opens the desk, so the whole thing
# works with nothing running locally.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "desk/**"
      - ".github/workflows/pages.yml"
  # The economic calendar is a "this week" file, so refresh it regularly.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CRA uses this as PUBLIC_URL, so the site's assets and the Open App link
      # resolve correctly under the /tickspy/ Pages subpath.
      PUBLIC_URL: https://sdmtchebe.github.io/tickspy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        # The lockfile pins eslint 9 while @typescript-eslint still asks for
        # eslint <= 8, so a plain `npm ci` exits ERESOLVE. The project was
        # installed with the legacy resolver; match that here.
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build landing page (bundles the desk at /desk/)
        working-directory: frontend
        env:
          # Optional: set a repository variable of this name (a support email
          # address) to enable the contact and feedback forms. The forms post
          # straight to that inbox through formsubmit.co, with no server. Left
          # unset, they say they are not configured instead of failing.
          REACT_APP_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: npm run build

      - name: Add the same-origin economic calendar
        run: |
          OUT=frontend/build/calendar.json
          if curl -fsS --max-time 30 \
              https://nfs.faireconomy.media/ff_calendar_thisweek.json \
              -o "$OUT.tmp"; then
            # The calendar host sends no CORS headers, so a browser cannot fetch
            # it directly; ship it with the site instead.
            if python3 -c "import json; json.load(open('$OUT.tmp'))" 2>/dev/null; then
              mv "$OUT.tmp" "$OUT"
            else
              echo "::warning::calendar payload was not valid JSON; ignoring this run"
              rm -f "$OUT.tmp"
            fi
          else
            echo "::warning::could not fetch the economic calendar this run"
          fi
          test -s "$OUT" || echo "[]" > "$OUT"
          echo "calendar bytes: $(wc -c < "$OUT")"

      - name: Sanity-check the artifact
        run: |
          test -f frontend/build/index.html || { echo "::error::no landing page"; exit 1; }
          test -f frontend/build/desk/index.html || { echo "::error::desk missing"; exit 1; }
          test -f frontend/build/desk/volmodel.js || { echo "::error::desk engine missing"; exit 1; }
          test -f frontend/build/desk/volmodel2.js || { echo "::error::desk stage-2 engine missing"; exit 1; }
          # Never publish secrets.
          if [ -e frontend/build/desk/local-config.js ]; then
            echo "::error::local-config.js must not be published"; exit 1
          fi
          echo "artifact ok"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Turn on Telegram alerts

# One button instead of a terminal.
#
# The site already ships the tutorial and the setup form; the only thing
# missing is the bot token on the Worker. This workflow turns the two values
# that only an owner can get into the deployment, without anyone installing
# wrangler, opening a shell or editing a file:
#
#   1. In Telegram, message @BotFather with /newbot and name it tickspy_alerts_bot
#      (that is the username every deep link already points at; a different name
#      must be changed in worker/wrangler.toml first).
#   2. GitHub -> Settings -> Secrets and variables -> Actions -> New repository
#      secret, twice:
#        TELEGRAM_BOT_TOKEN      the token BotFather printed
#        TELEGRAM_WEBHOOK_SECRET any long random string of letters, digits, _
#                                and - only (Telegram's own rule), 20+ characters
#   3. Actions -> "Turn on Telegram alerts" -> Run workflow.
#
# It stores both values as Worker secrets (never as plain variables, never in
# the repository), redeploys, registers the webhook with Telegram, and then
# asks the live config endpoint whether the panel is actually on. CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID are the same repository secrets the deploy workflow
# already uses.
#
# Nothing here runs on its own: it is dispatched by a person on purpose, because
# a missing bot token must never turn a push red.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check the two Telegram secrets are present and well formed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          missing=""
          [ -n "$TELEGRAM_BOT_TOKEN" ] || missing="$missing TELEGRAM_BOT_TOKEN"
          [ -n "$TELEGRAM_WEBHOOK_SECRET" ] || missing="$missing TELEGRAM_WEBHOOK_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings -> Secrets and variables -> Actions, then run this workflow again."
            exit 1
          fi
          # Telegram rejects a webhook secret with anything outside this alphabet,
          # and it fails later and less clearly if it is not checked here.
          case "$TELEGRAM_WEBHOOK_SECRET" in
            *[!A-Za-z0-9_-]*)
              echo "::error::TELEGRAM_WEBHOOK_SECRET may only contain letters, digits, _ and - (Telegram's rule)."
              exit 1
              ;;
          esac
          if [ "${#TELEGRAM_WEBHOOK_SECRET}" -lt 20 ]; then
            echo "::error::TELEGRAM_WEBHOOK_SECRET must be at least 20 characters."
            exit 1
          fi
          echo "Both secrets are present."

      - name: Store them on the Worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker
          # Piped on stdin so the value never appears as a command argument.
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@4 secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx --yes wrangler@4 secret put TELEGRAM_WEBHOOK_SECRET

      - name: Deploy the Worker with them
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Register the bot's webhook with Telegram
        id: setup
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          # The script warns when the token belongs to a bot whose username does
          # not match wrangler.toml — that is the one mistake that leaves the
          # site's Connect button opening a bot that knows nothing about this
          # Worker, so it fails the run instead of being scrolled past.
          set -o pipefail
          out=$(node worker/scripts/telegram-setup.mjs https://tickspy-api.sdmtchebe.workers.dev 2>&1 | tee /dev/stderr)
          if printf '%s' "$out" | grep -q "WARNING: wrangler.toml says"; then
            echo "::error::The token belongs to a different bot than TELEGRAM_BOT_USERNAME in worker/wrangler.toml. Fix the username there (or create the bot as tickspy_alerts_bot) and run this again."
            exit 1
          fi

      - name: Verify the panel is on
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            body=$(curl -sS -m 20 https://tickspy-api.sdmtchebe.workers.dev/api/alerts/config || true)
            if printf '%s' "$body" | grep -q '"telegram": true'; then
              echo "Telegram alerts are on: $(printf '%s' "$body" | python3 -c 'import json,sys;print(json.load(sys.stdin)["botUsername"])')"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The live config still reports telegram: false. Check that the secrets stored correctly and that the Worker redeployed."
          exit 1
